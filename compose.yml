services:
  novarum-amp:
    build: .
    image: ghcr.io/srizan10/amp-novarum:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
    # Lets you type an MFA code on first login: `docker compose run --rm novarum-amp`
    stdin_open: true
    tty: true

volumes:
  data:
